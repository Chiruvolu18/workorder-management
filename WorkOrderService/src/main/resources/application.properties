spring.application.name=WorkOrderService

server.port=8080
spring.profiles.active=dev


# H2 Database Configuration (for Local Development)
spring.datasource.url=jdbc:h2:mem:workorderdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA/Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable and expose the H2 console for easy viewing
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Enable Spring Security debug logging (prints filter chain and auth decisions)
spring.security.debug=true
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web=DEBUG