# Application Name
spring.application.name=UserAuthService
spring.threads.virtual.enabled=true

# Server Configuration
server.port=8081

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/userauth_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=MySecretKeyForJWTTokenGenerationAndValidation12345678901234567890
jwt.expiration=86400000

spring.devtools.restart.enabled=true
spring.devtools.remote.secret=my-secret-key
spring.devtools.remote.enabled=true