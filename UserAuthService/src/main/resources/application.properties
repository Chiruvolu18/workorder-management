spring.application.name=UserAuthService
spring.threads.virtual.enabled=true

# Server Port Configuration
server.port=8081  

# H2 Database Configuration (In-Memory for Local Development)
spring.datasource.url=jdbc:h2:mem:authdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA/Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create 
# 'create' ensures tables for user/roles are created automatically on startup

# Enable and expose the H2 console for easy viewing
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
